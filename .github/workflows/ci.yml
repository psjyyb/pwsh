name: CI

# main 브랜치 push / PR 시 백엔드 테스트(실 PostgreSQL) + 프론트 빌드·타입체크 자동 실행.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (JUnit + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwsh_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwer1234
        ports:
          - 5432:5432
        # pgcrypto 확장은 schema.sql이 생성(공식 postgres 이미지는 contrib 포함, postgres 유저=슈퍼유저)
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run backend tests
        working-directory: backend
        # 프로파일 test는 spring.sql.init로 ../sql/schema.sql·data.sql을 서비스 DB에 로드(작업 디렉터리=backend).
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/pwsh_test
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: qwer1234
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Upload coverage report (jacoco)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Type-check & build
        working-directory: frontend
        run: npm run build
      # vitest 도입 후 아래 단계 활성화:
      # - name: Unit tests
      #   working-directory: frontend
      #   run: npm run test -- --run
