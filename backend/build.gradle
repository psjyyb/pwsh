plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.pwsh'
// 프론트(frontend/package.json)와 같은 값을 유지한다 — 한쪽만 올리면 어느 버전이 배포됐는지 추적이 깨진다.
version = '0.6.7'
description = 'pwsh'

// ★ 이 프로젝트는 직접 만든 CMS(framework 저장소)를 복사해 만든 파생 서비스다.
//   위 version은 pwsh 자체 버전이고, 아래 cmsVersion은 "바탕 CMS의 어느 버전까지 흡수했는지"다.
//   둘은 따로 움직인다 — pwsh 기능만 추가하면 version만 오르고, CMS를 따라가면 cmsVersion만 오른다.
//   CMS의 최신 버전과 버전별 적용 방법(DDL 포함)은 framework 저장소의 CHANGELOG.md를 본다.
//   현재: 메뉴 아이콘 피커(CMS 1.2.1)까지 흡수.
ext.cmsVersion = '1.2.6'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// META-INF/build-info.properties 생성 → BuildProperties 빈으로 버전·빌드시각을 읽을 수 있다.
// (배포된 산출물이 어느 버전인지 화면·로그에서 확인하기 위함. actuator 없이 동작한다.)
springBoot {
	buildInfo {
		properties {
			// build-info.properties에 cmsVersion을 함께 넣어 BuildProperties.get("cmsVersion")로 읽는다.
			additional = ['cmsVersion': project.ext.cmsVersion]
		}
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Spring Boot ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 메일 발송(이메일 인증코드). SMTP 계정은 환경변수(MAIL_USERNAME/MAIL_PASSWORD)로 주입.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// AOP(행위 로그 EventLogAspect). spring-aop는 web 전이 의존, aspectjweaver 추가 시 Boot가 자동활성화.
	implementation 'org.aspectj:aspectjweaver'

	// --- MyBatis (Boot 4.1 호환 검증 대상) ---
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'

	// --- JWT (jjwt) ---
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- DB ---
	runtimeOnly 'org.postgresql:postgresql'

	// --- DB 마이그레이션(Flyway) ---
	// 스키마 변경을 db/migration의 SQL 파일로 관리하고, 기동 시 미적용분만 자동 실행한다.
	// ★ Boot 4는 기술별 자동설정이 모듈로 쪼개져 있다 — spring-boot-flyway를 넣어야
	//   Flyway 자동설정이 붙는다(flyway-core만 넣으면 마이그레이션이 조용히 실행되지 않는다).
	// ★ flyway-database-postgresql도 함께 넣는다 — Flyway 10부터 DB별 지원이 분리돼
	//   빠지면 "Unsupported Database: PostgreSQL"로 기동이 실패한다. 버전은 Boot BOM이 관리.
	implementation 'org.springframework.boot:spring-boot-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = false
		csv.required = false
	}
}
