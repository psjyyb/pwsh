# =====================================================================
# 테스트(test) 프로파일 — 로컬 전용 PostgreSQL(pwsh_test)
# 실제 DB 엔진을 그대로 사용(모킹 0). pgcrypto·RETURNING·캐스팅 등 운영 SQL 그대로 검증.
# 매 테스트 실행마다 스키마를 초기화(Flyway clean → migrate)해 깨끗한 상태 보장.
#   ★ 스키마 정의의 단일 출처는 db/migration이다. 테스트도 같은 마이그레이션을 태우므로
#     마이그레이션이 깨지면 여기서 먼저 드러난다(sql/*.sql을 따로 읽지 않는다).
# (Docker가 있으면 향후 Testcontainers로 전환 가능 — base 클래스만 교체)
# =====================================================================
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/pwsh_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:qwer1234}
  # 스키마·기초데이터는 Flyway가 만든다. sql.init은 쓰지 않는다(두 벌 관리 방지)
  sql:
    init:
      mode: never
  flyway:
    # 테스트에서만 clean 허용 — 운영에서 켜지면 DB를 통째로 날릴 수 있는 스위치다
    clean-disabled: false

jwt:
  secret: test-secret-framework-0123456789

logging:
  level:
    com.pwsh: info
    org.flywaydb: info