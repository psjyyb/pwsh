# ============================================================================
# 사용자에게 보이는 메시지. 문구를 고칠 때 코드를 건드리지 않게 여기로 모았다.
#
# 규칙
#  - 키는 error.{영역}.{상황} 꼴. 영역은 대체로 도메인 이름.
#  - error.{코드}(예: error.C001)는 ErrorCode 기본 메시지의 재정의다. 여기 없으면
#    enum의 값이 그대로 쓰인다(enum이 기본값, 여기가 덮어쓰기).
#  - 값에 {0} {1}을 쓰면 인자로 치환된다(Messages.get(key, args...)).
#  - 파일은 UTF-8. spring.messages.encoding=UTF-8로 읽는다(application.yml).
#  - 키를 못 찾으면 Messages가 경고 로그를 남기고 키 문자열을 그대로 반환한다
#    (조용히 빈 문자열이 나가면 원인을 찾기 어렵다).
#
# ★ 이 파일은 바탕 CMS(framework)의 것을 복사한 뒤 이 서비스 고유 도메인
#   (모집·후기·쪽지·신고·북마크·좋아요·팔로우·차단·알림·피드·셀프가입)의 문구를 추가한 것이다.
#   CMS를 따라잡을 때 CMS 쪽에 새 키가 생겼는지 확인할 것.
# ============================================================================

# ---------------------------------------------------------------- 공통
