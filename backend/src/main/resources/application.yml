# =====================================================================
# 공통 설정 (프로파일 무관)
# DB 접속정보는 프로파일별(application-{env}.yml)에서 환경변수로 주입
# =====================================================================
spring:
  application:
    name: pwsh
  # 사용자 노출 메시지(messages.properties) — 문구를 코드에서 분리해 한 곳에서 관리한다.
  # encoding을 명시하는 이유: 기본값이 바뀌면 한글이 깨진 채로 조용히 응답에 실린다.
  messages:
    basename: messages
    encoding: UTF-8
  profiles:
    active: dev

  # DB 마이그레이션 — 스키마의 단일 출처는 db/migration의 SQL 파일이다.
  # 기동할 때 flyway_schema_history를 보고 미적용분만 실행한다(수동 DDL 실행 불필요).
  #  - baseline-on-migrate: 테이블이 이미 있는 기존 DB에서 이력 테이블만 만들고 시작한다.
  #  - baseline-version 2: V1(스키마)·V2(기초데이터)는 "이미 적용됨"으로 표시하고 건너뛴다.
  #    빈 DB에는 적용되지 않아 V1·V2가 정상 실행된다.
  #  ★ 이미 적용된 마이그레이션 파일은 고치지 않는다. 체크섬이 달라지면 기동이 막힌다.
  #  ★ 번호 규칙: CMS에서 가져오는 것은 V3~V999, pwsh 고유는 V1001~ (충돌 방지)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
  # 응답 JSON에서 null 필드 제외 (BaseVO의 페이징/검색 등 미사용 필드가 응답에 노출되지 않도록)
  jackson:
    default-property-inclusion: non_null

  # 파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  # 메일(SMTP) — 이메일 인증코드 발송. 발신 계정/앱비밀번호는 환경변수로만 주입(소스 저장 금지).
  # 예: MAIL_USERNAME=sender@gmail.com  MAIL_PASSWORD=<구글 앱 비밀번호 16자리>
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

# 메일 발송
#  - enabled: false면 실제 SMTP 전송을 하지 않고 이력만 SKIP으로 남긴다(개발·테스트 기본값).
#    운영에서 true로 켠다. 계정 미설정 상태로 켜면 발송이 FAIL로 남는다(조용히 삼키지 않는다).
#  - log.retention-days: 이력 보존기간. 본문에 인증번호가 남으므로 무한 보관하지 않는다. 0이면 정리 안 함.
mail:
  enabled: ${MAIL_ENABLED:false}
  log:
    retention-days: 90
    cron: "0 30 4 * * *"  # 매일 새벽 4시 30분(파일 GC 4시와 겹치지 않게)

# 파일 업로드 저장 경로 (기본: 실행 디렉터리의 uploads. 운영은 환경변수 FILE_UPLOAD_DIR)
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  # 고아 파일 정리(GC): 파일만 삭제(DB 기본데이터 행은 보존)
  gc:
    retention-days: 180  # C: 삭제된 엔티티 파일 보존기간(일)
    abandon-hours: 24    # A: 업로드 후 미저장 파일 유예(시간)
    cron: "0 0 4 * * *"  # 매일 새벽 4시 자동 실행

# 모집: 모임 하루 전 리마인더 알림 배치(주최자 + 수락 참여자)
recruit:
  remind:
    cron: "0 0 9 * * *"  # 매일 오전 9시 — 내일 모임 대상

# MyBatis: 컬럼(snake) → VO 필드(camel) 자동 매핑
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.pwsh
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# 로그 패턴에 요청 추적 ID(RequestLoggingFilter가 MDC에 넣는 reqId)를 포함 —
# 동시 요청이 섞여도 한 요청의 로그를 묶어서 볼 수 있다. 값이 없는 로그(기동 등)는 빈칸으로 나온다.
logging:
  pattern:
    level: "%5p [%X{reqId:-}]"

# 보안 응답 헤더 (SecurityConfig)
#  - csp: 빈 값이면 헤더 미전송. 외부 이미지/에디터/카카오맵이 있으면 정책을 넓혀야 한다.
#  - hsts-max-age: 0=미전송. HTTPS 운영에서만 값을 준다(HTTP 개발환경에서 켜면 접속이 막힌다).
security:
  headers:
    csp: ""
    hsts-max-age: 0
    referrer-policy: strict-origin-when-cross-origin

# JWT (secret은 환경변수/시크릿으로 주입)
jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 1209600000  # 14일
